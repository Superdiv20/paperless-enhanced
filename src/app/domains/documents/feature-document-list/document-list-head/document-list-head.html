<div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
  <!-- Search Bar -->
  <div hlmInputGroup class="w-full h-8">
    <input
      hlmInputGroupInput
      placeholder="Search documents..."
      [value]="searchQuery()"
      (input)="onSearchChange($any($event.target).value)"
    />
    <div hlmInputGroupAddon>
      <ng-icon name="lucideSearch" />
    </div>
  </div>

  <hlm-dialog>
    <!-- Date Selector -->
    <button hlmDialogTrigger hlmBtn variant="outline" size="sm" (click)="onDateDialogOpen()" class="w-full sm:w-auto">
      <ng-icon name="lucideCalendarDays" />
      <ng-container i18n>Date</ng-container>
      @if (isDateFilterActive()) {
        <span hlmBadge variant="secondary" aria-label="Date filter active">●</span>
      }
    </button>
    <hlm-dialog-content class="sm:max-w-[425px]" *hlmDialogPortal="let ctx">
      <hlm-dialog-header>
        <ng-container i18n>Select Date</ng-container>
      </hlm-dialog-header>
      <hlm-separator></hlm-separator>
      <div
        hlmToggleGroup
        type="single"
        size="sm"
        variant="outline"
        class="w-full"
        [value]="dialogDateField()"
        (valueChange)="onDialogDateFieldChange($any($event))"
      >
        <button hlmToggleGroupItem value="created" class="flex-1" aria-label="Created date">
          <ng-container i18n>Created</ng-container>
        </button>
        <button hlmToggleGroupItem value="added" class="flex-1" aria-label="Added date">
          <ng-container i18n>Added</ng-container>
        </button>
      </div>
      <div class="h-full flex space-x-2">
        <hlm-toggle-group
          type="single"
          nullable
          size="sm"
          class="flex flex-col gap-2 justify-stretch"
          [value]="dialogDatePreset()"
          (valueChange)="onDialogPresetChange($any($event))"
        >
          <button
            hlmToggleGroupItem
            value="today"
            aria-label="Today"
            class="w-full justify-start"
          >
            <ng-container i18n>Today</ng-container>
          </button>
          <button
            hlmToggleGroupItem
            value="yesterday"
            aria-label="Yesterday"
            class="w-full justify-start"
          >
            <ng-container i18n>Yesterday</ng-container>
          </button>
          <button
            hlmToggleGroupItem
            value="7days"
            aria-label="Last 7 days"
            class="w-full justify-start"
          >
            <ng-container i18n>Last 7 days</ng-container>
          </button>
          <button
            hlmToggleGroupItem
            value="30days"
            aria-label="Last 30 days"
            class="w-full justify-start"
          >
            <ng-container i18n>Last 30 days</ng-container>
          </button>
          <button
            hlmToggleGroupItem
            value="1year"
            aria-label="Last year"
            class="w-full justify-start"
          >
            <ng-container i18n>Last year</ng-container>
          </button>
        </hlm-toggle-group>
        <hlm-calendar-range
          [startDate]="dialogDateStart() ?? undefined"
          (startDateChange)="onCalendarStartChange($event)"
          [endDate]="dialogDateEnd() ?? undefined"
          (endDateChange)="onCalendarEndChange($event)"
          [min]="minDate"
          [max]="maxDate"
        />
      </div>
      <hlm-dialog-footer>
        <button hlmBtn hlmDialogClose variant="outline" size="sm">
          <ng-container i18n>Cancel</ng-container>
        </button>
        <button hlmBtn hlmDialogClose size="sm" (click)="applyDateFilter()">
          <ng-container i18n>Apply</ng-container>
        </button>
      </hlm-dialog-footer>
    </hlm-dialog-content>
  </hlm-dialog>

  <hlm-sheet side="right">
    <!-- Filter Button -->
    <button
      hlmBtn
      hlmSheetTrigger
      variant="outline"
      size="sm"
      aria-label="Filter documents"
      class="w-full sm:w-auto"
    >
      <ng-icon name="lucideFilter" />
      Filter

      @if (filterCount() > 0) {
        <span hlmBadge variant="secondary" aria-label="Filter count">{{
          filterCount()
        }}</span>
      }
    </button>

    <hlm-sheet-content
      *hlmSheetPortal="let ctx"
      class="p-2 w-[400px] sm:w-[540px] sm:max-w-none"
    >
      <hlm-sheet-header>
        <h3 hlmSheetTitle>Filters</h3>
        <p hlmSheetDescription>Narrow down your documents.</p>
      </hlm-sheet-header>
      <hlm-separator></hlm-separator>
      <div class="flex flex-col gap-6 px-4 py-4">
        <paperless-filter-editor />
      </div>
      <hlm-sheet-footer>
        <button hlmBtn variant="destructive" size="sm" (click)="clearFilters()">
          <ng-icon name="lucideX"></ng-icon>
          <ng-container i18n>Clear Filters</ng-container>
        </button>
      </hlm-sheet-footer>
    </hlm-sheet-content>
  </hlm-sheet>

  <!-- Sort Button -->
  <button
    hlmBtn
    variant="outline"
    size="sm"
    [disabled]="displayMode() === DisplayMode.TABLE"
    aria-label="Sort documents"
    [hlmDropdownMenuTrigger]="sorting"
  >
    Sort
    <ng-icon name="lucideArrowUpDown" />
  </button>
  <ng-template #sorting>
    <hlm-dropdown-menu class="w-56">
      <hlm-dropdown-menu-group>
        @for (field of sortFields; track field.field) {
          <button
            hlmDropdownMenuRadio
            [checked]="isSortFieldActive(field)"
            (triggered)="setSortField(field)"
          >
            <hlm-dropdown-menu-radio-indicator />
            <span>{{ field.name }}</span>
          </button>
        }
      </hlm-dropdown-menu-group>
    </hlm-dropdown-menu>
  </ng-template>

  <!-- Field Selector -->
  <button
    hlmBtn
    variant="outline"
    size="sm"
    aria-label="Select fields to display"
    [hlmDropdownMenuTrigger]="fields"
  >
    Fields
    <ng-icon name="lucideColumns3Cog" />
  </button>
  <ng-template #fields>
    <hlm-dropdown-menu class="w-56">
      <hlm-dropdown-menu-group>
        @for (field of allDisplayFields(); track field.id) {
          <button
            hlmDropdownMenuCheckbox
            [checked]="isDisplayFieldActive(field.id)"
            (triggered)="toggleDisplayField(field.id)"
          >
            <hlm-dropdown-menu-checkbox-indicator />
            <span>{{ field.name }}</span>
          </button>
        }
      </hlm-dropdown-menu-group>
    </hlm-dropdown-menu>
  </ng-template>

  <!-- View Toggle -->
  <div
    hlmToggleGroup
    type="single"
    variant="outline"
    size="sm"
    [value]="displayMode()"
    (valueChange)="onDisplayModeChange($any($event))"
  >
    <button hlmToggleGroupItem value="table" title="Table view">
      <ng-icon name="lucideTable" />
    </button>
    <button hlmToggleGroupItem value="grid" title="Grid view">
      <ng-icon name="lucideLayoutGrid" />
    </button>
    <button hlmToggleGroupItem value="list" title="List view">
      <ng-icon name="lucideList" />
    </button>
  </div>

  <!-- Save Views -->
  <button hlmBtn variant="default" size="sm">
    <ng-icon name="lucideSave"></ng-icon>
    <ng-container i18n>Save View</ng-container>
  </button>
</div>
